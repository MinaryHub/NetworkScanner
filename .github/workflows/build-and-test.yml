name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Core 테스트는 OS별 분기 코드(ARP/자격 증명/경로)를 각 OS에서 실제로 검증하기 위해 3개 OS에서 모두 돌린다.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test NetworkScanner.Tests/NetworkScanner.Tests.csproj --configuration Release
      - name: Test collector
        if: runner.os == 'Linux'
        run: dotnet test NetworkScanner.Collector.Tests/NetworkScanner.Collector.Tests.csproj --configuration Release
      # 알려진 취약점이 있는 패키지를 쓰면 실패시킨다.
      - name: Check vulnerable packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet restore NetworkScanner.sln
          out=$(dotnet list NetworkScanner.sln package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -qi "has the following vulnerable packages"; then exit 1; fi

  # 솔루션 전체가 어느 OS에서든 빌드되는지 확인한다(Windows 전용 프로젝트는 더 이상 없다).
  build:
    name: Build solution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build NetworkScanner.sln --configuration Release

  docker:
    name: Docker image builds (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: netscan:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.collector
          push: false
          tags: netscan-collector:ci

  build-avalonia:
    name: Package (Velopack) Avalonia app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            mainExe: NetworkScanner.Avalonia.exe
            icon: assets/app.ico
          - os: macos-latest
            rid: osx-arm64
            mainExe: NetworkScanner.Avalonia
            icon: assets/app.icns
          - os: ubuntu-latest
            rid: linux-x64
            mainExe: NetworkScanner.Avalonia
            icon: assets/app.png
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained (${{ matrix.rid }})
        run: >
          dotnet publish NetworkScanner.Avalonia/NetworkScanner.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -o publish/${{ matrix.rid }}
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk
      - name: Add dotnet tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # vpk는 OS별 설치 패키지(.exe 설치본/.pkg·.app/.AppImage 등)를 실행 중인 OS에 맞춰 만든다.
      # 다른 OS를 대상으로 한 크로스 패키징은 지원하지 않으므로, 매트릭스의 각 OS에서 자신의
      # 패키지를 직접 만든다.
      - name: Package with Velopack (${{ matrix.rid }})
        shell: bash
        run: >
          vpk pack --packId NetworkScanner --packVersion "1.0.${{ github.run_number }}"
          --packDir "publish/${{ matrix.rid }}" --mainExe "${{ matrix.mainExe }}"
          --packTitle "Network Scanner" --packAuthors SMIC
          --runtime ${{ matrix.rid }} --outputDir "release-packages/${{ matrix.rid }}"
          ${{ matrix.icon != '' && format('--icon {0}', matrix.icon) || '' }}
      - name: Upload packaged installer
        uses: actions/upload-artifact@v4
        with:
          name: NetworkScanner-${{ matrix.rid }}-installer
          path: release-packages/${{ matrix.rid }}
