name: Release

# 버전 태그(v1.0.0 등)를 push하면 Windows/macOS/Linux(x64·arm64)용 Velopack 설치 패키지, CLI 압축본,
# 헤드리스 서비스 압축본, Docker 이미지를 만들고 하나의 GitHub Release에 첨부한다.
# 수동 실행(workflow_dispatch)도 지원하며, 이 경우 버전을 직접 입력해야 한다.
#
# 코드 서명: 아래 secrets가 설정되어 있으면 서명/공증까지 수행하고, 없으면 서명 없이 패키징한다.
#   Windows : WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD  (Authenticode, signtool)
#   macOS   : MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_KEYCHAIN_PASSWORD,
#             MACOS_SIGN_IDENTITY ("Developer ID Application: ..."), APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (notarytool)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 1.0.0)'
        required: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # 테스트가 깨진 상태로는 아무것도 패키징/배포하지 않는다(Linux 한 번이면 충분; OS별 검증은 build-and-test.yml 몫).
  test:
    name: Build + test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build solution
        run: dotnet build KetworkScanner.sln -c Release -p:Version=${{ needs.version.outputs.value }}
      - name: Test Core
        run: dotnet test KetworkScanner.Tests/KetworkScanner.Tests.csproj -c Release --no-build
      - name: Test CLI
        run: dotnet test KetworkScanner.Cli.Tests/KetworkScanner.Cli.Tests.csproj -c Release --no-build
      - name: Test collector
        run: dotnet test KetworkScanner.Collector.Tests/KetworkScanner.Collector.Tests.csproj -c Release --no-build

  package:
    name: GUI (${{ matrix.rid }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # channel: Velopack 업데이트 피드/파일 이름. 기존 설치본(1.7.x)이 보던 기본 채널(win/osx/linux)은
          # x64(macOS는 arm64) 빌드가 그대로 차지하고, 새 아키텍처는 RID 이름의 채널을 쓴다(UpdateService와 맞춤).
          - os: windows-latest
            rid: win-x64
            channel: win
            mainExe: KetworkScanner.Avalonia.exe
            icon: assets/app.ico
          - os: windows-latest
            rid: win-arm64
            channel: win-arm64
            mainExe: KetworkScanner.Avalonia.exe
            icon: assets/app.ico
          - os: macos-latest
            rid: osx-arm64
            channel: osx
            mainExe: KetworkScanner.Avalonia
            icon: assets/app.icns
          # Intel macOS 패키징: macos-13 러너는 퇴역했고 macos-15-intel 이 마지막 x64 러너다.
          - os: macos-15-intel
            rid: osx-x64
            channel: osx-x64
            mainExe: KetworkScanner.Avalonia
            icon: assets/app.icns
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux
            mainExe: KetworkScanner.Avalonia
            icon: assets/app.png
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            channel: linux-arm64
            mainExe: KetworkScanner.Avalonia
            icon: assets/app.png
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained (${{ matrix.rid }})
        run: >
          dotnet publish KetworkScanner.Avalonia/KetworkScanner.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ needs.version.outputs.value }}
          -o publish/${{ matrix.rid }}

      # ---- Windows Authenticode (secrets가 있을 때만) ----
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.PFX != ''
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:PFX))
          echo "SIGN_PFX=$env:RUNNER_TEMP\cert.pfx" >> $env:GITHUB_ENV
      - name: Sign Windows binaries
        if: runner.os == 'Windows' && env.SIGN_PFX != ''
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem publish/${{ matrix.rid }} -Include *.exe,*.dll -Recurse | ForEach-Object {
            & $signtool.FullName sign /f $env:SIGN_PFX /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
          }

      # ---- macOS Developer ID 서명 + 공증 (secrets가 있을 때만) ----
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.P12 != ''
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          echo "MAC_SIGN=1" >> "$GITHUB_ENV"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk
      - name: Add dotnet tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # vpk는 실행 중인 OS에 맞는 패키지만 만들 수 있어(크로스 패키징 불가), 매트릭스의 각 OS에서 자신의 패키지를 직접 만든다.
      # macOS는 서명 ID/공증 자격이 있으면 vpk가 codesign + notarytool까지 수행한다.
      - name: Package with Velopack (${{ matrix.rid }})
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          EXTRA=""
          if [ -n "${{ matrix.icon }}" ]; then EXTRA="$EXTRA --icon ${{ matrix.icon }}"; fi
          if [ "${MAC_SIGN:-}" = "1" ] && [ -n "$MACOS_SIGN_IDENTITY" ]; then
            EXTRA="$EXTRA --signAppIdentity \"$MACOS_SIGN_IDENTITY\" --signInstallIdentity \"$MACOS_SIGN_IDENTITY\""
            if [ -n "$APPLE_ID" ]; then
              xcrun notarytool store-credentials netscan-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
              EXTRA="$EXTRA --notaryProfile netscan-notary"
            fi
          fi
          eval vpk pack --packId KetworkScanner --packVersion "${{ needs.version.outputs.value }}" \
            --packDir "publish/${{ matrix.rid }}" --mainExe "${{ matrix.mainExe }}" \
            --packTitle "\"Ketwork Scanner\"" --packAuthors SMIC \
            --runtime ${{ matrix.rid }} --channel ${{ matrix.channel }} --outputDir "release-packages/${{ matrix.rid }}" $EXTRA

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KetworkScanner-${{ matrix.rid }}
          path: release-packages/${{ matrix.rid }}

  # 헤드리스 CLI(netscan)와 스케줄러 서비스(netscan-service)를 OS/아키텍처별 단일 실행 파일로 publish해 압축본으로 첨부한다.
  headless:
    name: CLI + service (${{ matrix.rid }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish CLI and service (${{ matrix.rid }})
        shell: bash
        run: |
          for proj in KetworkScanner.Cli KetworkScanner.Service; do
            dotnet publish $proj/$proj.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
              -p:PublishSingleFile=true -p:Version=${{ needs.version.outputs.value }} -o publish-headless/${{ matrix.rid }}
          done
          cp -r deploy publish-headless/${{ matrix.rid }}/deploy

      - name: Archive
        shell: bash
        run: |
          mkdir -p headless-packages
          NAME="netscan-${{ needs.version.outputs.value }}-${{ matrix.rid }}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd "publish-headless/${{ matrix.rid }}" && 7z a "../../headless-packages/${NAME}.zip" .)
          else
            tar -czf "headless-packages/${NAME}.tar.gz" -C "publish-headless/${{ matrix.rid }}" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netscan-${{ matrix.rid }}
          path: headless-packages

  docker:
    name: Docker image (CLI)
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/netscan:${{ needs.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/netscan:latest

  docker-collector:
    name: Docker image (collector)
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.collector
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/netscan-collector:${{ needs.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/netscan-collector:latest

  release:
    name: Create GitHub Release
    needs: [version, package, headless, docker, docker-collector]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          # 헤드리스 자체 업데이트(netscan update / 서비스 자동 업데이트)가 다운로드를 검증하는 데 쓰는 해시 목록.
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: v${{ needs.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
